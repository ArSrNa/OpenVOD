.devenv: &devenv
  docker:
    # build: .ide/Dockerfile
    image: docker.cnb.cool/arsrna/media/openvod/dev:latest
  runner:
    cpus: 64

.install: &install
  name: 安装固定版本 Bun 和仓库依赖
  script:
    - bun i

.build-dev-image: &build-dev-image
  name: 构建并推送开发环境镜像
  runner:
    cpus: 32
  services:
    - docker
  stages:
    - name: buildx 构建并推送 dev 镜像
      script:
        - docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/dev:latest -f .ide/Dockerfile . --push

# 分发端镜像（ADR-0003：SCF 容器目标）
# 构建上下文必须是 apps/delivery —— Dockerfile 的 COPY 路径相对该目录，用仓库根会找不到 go.mod。
# 注意：SCF 仅接受 x86。构建机若为 arm64（或需强制对齐架构），把最后两条改成：
#   docker buildx build --platform linux/amd64 --push -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/delivery:latest apps/delivery
.build-delivery-image: &build-delivery-image
  name: 构建并推送 delivery 镜像
  runner:
    cpus: 32
  services:
    - docker
  stages:
    - name: docker build delivery
      script:
        - cd apps/delivery
        - docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/delivery:latest . --push

# 分发端 EdgeOne Cloud Functions（ADR-0003：与 SCF 容器同级的另一个目标）
# 用开发镜像的 Go + Bun；scripts/edgeone.ts 固定 Makers CLI 版本，构建和上传使用同一份产物。
# 变量值先留空：正式值走 CNB 密钥仓库 imports（或平台环境变量），不要写进仓库。
.deploy-delivery-edgeone: &deploy-delivery-edgeone
  name: 构建并部署 delivery 到 EdgeOne
  runner:
    cpus: 32
  docker:
    image: docker.cnb.cool/arsrna/media/openvod/dev:latest
  env:
    EO_DELIVERY_URL: https://delivery.ovod.skirk.cn
    EO_API_REGION: china
  stages:
    - name: 构建 Makers 产物并校验 Go 根路径路由
      script: bun --no-env-file scripts/edgeone.ts build
    - name: 校验生产引导变量并上传 Makers 产物
      imports: https://cnb.cool/arsrna/env/-/blob/main/tencent.yml
      script: bun --no-env-file scripts/edgeone.ts deploy
    - name: 等待分发服务就绪并验证播放鉴权路由
      script: bun --no-env-file scripts/check-delivery-deployment.ts "$EO_DELIVERY_URL"

# 管理端 admin 镜像（ADR-0003 / ADR-0013：Next.js 全栈单容器，UI + API 同源）
# 构建上下文是**仓库根**：admin 经 transpilePackages 直接消费 workspace 的 TS 源码包。
.build-admin-image: &build-admin-image
  name: 构建并推送 admin 镜像
  runner:
    cpus: 32
  services:
    - docker
  stages:
    - name: docker build admin
      script:
        - docker build -f apps/admin/Dockerfile -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/admin:latest . --push

# 转码 Worker 镜像（ADR-0003 / ADR-0008：Bun 常驻容器；P0 转码禁止上函数）
# 构建上下文同为仓库根；镜像内含 ffmpeg/ffprobe（worker 启动自检的必需项）。
.build-worker-image: &build-worker-image
  name: 构建并推送 worker 镜像
  runner:
    cpus: 32
  services:
    - docker
  stages:
    - name: docker build worker
      script:
        - docker build -f apps/worker/Dockerfile -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/worker:latest . --push

# 播放演示 App player 镜像（spec.md §11.8：Next.js 全栈单容器，免登录播放端 Demo）
# 构建上下文同为仓库根（workspace 源码直引）；不依赖 Prisma，构建期无需生成客户端与 env——
# 浏览器直连分发端地址由运行时 env 下发（/api/session 的 delivery_base），镜像可跨环境复用。
.build-player-image: &build-player-image
  name: 构建并推送 player 镜像
  runner:
    cpus: 32
  services:
    - docker
  stages:
    - name: docker build player
      script:
        - docker build -f apps/player/Dockerfile -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/player:latest . --push

# 播放器 SDK（openvod-jssdk）：单测覆盖率上报 + 发布到 npm 官方与 CNB 制品库。
# 版本号唯一真源 = 根 package.json 的 version（与 auto_tag 同口径，tag_push 时脚本还会校验 tag 名与版本一致）；
# 发布清单 / dist 构建 / 产物自包含校验都由 packages/player-sdk/scripts/publish.ts 负责（本地同一条命令可复现）。
# 触发：tag_push（打 tag 发版，与镜像同批）+ 手动按钮 web_trigger_publish_sdk（补发 / 先只发 npm）。
.publish-sdk: &publish-sdk
  name: 发布播放器 SDK（单测覆盖率 + npm 官方 / CNB 制品库）
  runner:
    cpus: 8
  docker:
    image: docker.cnb.cool/arsrna/media/openvod/dev:latest # 内置 Bun 1.4 / Node 22 / npm
  env:
    # CNB npm 制品库地址（控制台「制品库 → 设置 → 基础设置」复制；须放在 env 下才会注入为环境变量）。
    # 也可改由密钥仓库 env/npm.yml 提供同名变量——同一 job 内 env 优先于 imports。
    CNB_NPM_REGISTRY: https://npm.cnb.cool/arsrna/media/openvod-jssdk/-/packages/
  stages:
    - <<: *install
    - name: 单测与覆盖率
      script: bun run --cwd packages/player-sdk test:coverage
    - name: 覆盖率上报（CNB 洞察 / 徽章）
      type: testing:coverage
      options:
        pattern: packages/player-sdk/coverage/lcov.info
        allowExts: ".ts"
        lines: 70 # 全量行覆盖率红线（当前 ~98%，低于此值阻断发布）
        breakIfNoCoverage: true
      exports:
        lines: SDK_COVERAGE
    - name: 构建并发布（npm 官方 + CNB 制品库）
      imports:
        - https://cnb.cool/arsrna/env/-/blob/main/npm.yml # NPM_TOKEN；CNB 制品库用内置 CNB_TOKEN
      script:
        - bun packages/player-sdk/scripts/publish.ts --registry both

# 自动生成 Tag（Tag 列表页「自动生成 Tag」按钮触发）：tag 名 = **根 package.json 的 version**（不带 v 前缀）。
#
# ── 根因：以前这段配置从未被执行（2026-10-16 修正） ──
# `auto_tag` 是平台的「页面操作事件」：点按钮时平台**先注入一条内置的 auto_tag 流水线**
# （镜像 cnbcool/git-auto-tag，按提交语义推导版本），再与 .cnb.yml 的配置合并；同分支下后出现者覆盖，
# 而**写在 `$` 下的 auto_tag 会被直接忽略**——官方 build/trigger-rule.md「配置覆盖规则」原文：
# 「两边的 auto_tag 配置都会保留，但 `$` 下的配置会被忽略」。
# 本仓库此前正是把「读 package.json 打 tag」的 job 挂在 `$` 下，所以它一次都没跑过：
# 2026-10-16 构建 cnb-nuh-1k52f23cb 的日志里只有内置插件在跑，semantic-release 把
# package.json=1.1.0 的库按 feat/fix 推导成了 **0.3.0**，自写的三个 stage 一个都没出现。
# 此前几次 auto_tag「成功」也都是内置插件打的语义化 tag。
# 教训：当时把「以实测为准」读成了「`$` 下也能生效」，实际是「我们的 job 没生效，生效的是内置插件」。
#
# ── 解法：让内置插件打 tag，但把 tag 名钉死成 package.json 的版本号 ──
# 插件把 settings.tagFormat 交给 semantic-release，最终过 lodash 模板
# （semantic-release 20 的 lib/utils.js makeTag = `template(tagFormat)({ version })`；
#  更新的 master 版是加了 {evaluate:false, escape:false}，两者对下面的写法结果一致）。
# `${...}` 是**求值表达式**，模板作用域里只有 `version` 一个变量。实测（semantic-release 20.1.3 +
# lodash 4.18.1，两种 template 调用方式都试过）：
#   - `v${version}`        → `v0.3.0`  平台默认，语义化推导值，不是我们要的
#   - `${version}`         → `0.3.0`   同上
#   - `${PKG_VERSION}`     → **ReferenceError: PKG_VERSION is not defined**
#   - `\${PKG_VERSION}`    → 同上（lodash 不支持 `\` 转义，别试）
#   - `${'1.1.0'}`         → `1.1.0`   ✅ 单引号内容是**字符串字面量**，求值结果就是它自己
# 为什么自定义变量一律不可用：插件内部用 `exec` 起 git 命令，stage 的 `exports` 只进主进程环境，
# 到不了模板求值的作用域；`${version}` 是唯一被显式喂进 `template(...)({ version })` 的变量。
# 所以只能走 `${'<version>'}`，把 package.json 的版本号当字面量嵌进去（版本号已过语义化校验，
# 只含 `[0-9A-Za-z.-]`，不含单引号，嵌入安全）。
#
# ── 为什么配置里写成 '${''$PKG_VERSION''}' 这种怪样子 ──
# YAML 的单引号只是 YAML 语法、不进属性值，解析后属性值实为 `${'$PKG_VERSION'}`。
# 而 settings 属性值会做「$变更 变量替换」，其中的 `$PKG_VERSION` 会被换成版本号，最终得到
# `${'1.1.0'}`。字面量那个 `$` **不需要转义**：它后面紧跟单引号，不构成合法变量名
# （变量名只允许字母/数字/下划线、不能以数字开头），替换器不会碰它（已实测）。
#
# ── 仍未实测：平台会不会采纳 `$` 下的这条配置 ──
# 既然文档说 `$` 下的 auto_tag 会被忽略，本 job 是否能盖掉内置那条**没有验证**。
# 验证入口：.cnb/web_trigger.yml 的「验证autoTag」按钮（`web_trigger_verify_autotag`）跑同一份 job，
# 可在不动 Tag 列表页的前提下看结果。若 Tag 列表页打出的仍是 0.x 语义化版本（或本 job 压根没出现），
# 把本锚点整段挪到 `main:` 分支名下即可（同分支覆盖成立），并为其补 `imports`
# 提供 `CNB_TOKEN_USER_NAME` / `CNB_TOKEN`（挪走后 stage 末尾的 git ls-remote 复核需要用）。
#
# 运行 / 检出分支由 CNB「Tag 自动生成配置」决定：默认分支下的 .cnb/settings.yml → tag.auto_tag.branch
# （默认值 = 仓库默认分支 main；本仓库未配置该文件）；Tag 列表页按钮**不能临时选分支**，
# 检出内容 = 该分支最新 commit ⇒ **发版前先把待发布提交合入 main**。
#
# 本 job 不需要任何密钥：推 tag 由内置插件用它自己的凭证完成（它也不读本 job 的 env）。
# 之前「Git LFS 导致 push 失败」（`git-lfs was not found`）来自自写的 push 阶段，改用插件推送后消失；
# 仍用开发镜像（含 git-lfs 3.4.1）是因为末尾要 `git ls-remote` 复核、且检出带 LFS 钩子。
.auto-tag: &auto-tag
  name: 按根 package.json 版本创建 Tag
  docker:
    image: docker.cnb.cool/arsrna/media/openvod/dev:latest # 含 node + git + git-lfs
  stages:
    - name: 读取根 package.json 的版本号
      script: |
        # 只认真正 key 为 "version" 的那一行（避开依赖里的 "version" 字段）
        VERSION=$(grep -A1 -m1 -E '^[[:space:]]*"version"[[:space:]]*:' package.json \
          | grep -oE '[0-9][0-9A-Za-z.+-]*' | head -1)
        echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
          || { echo "根 package.json 的 version 不是合法语义化版本：'$VERSION'"; exit 1; }
        echo "根 package.json 的 version = $VERSION"
        echo "##[set-output version=$VERSION]"
      exports:
        version: PKG_VERSION
    - name: 按 package.json 版本创建 Tag
      image: cnbcool/git-auto-tag:latest
      settings:
        # 展开为 ${'1.1.0'}，交给插件内 semantic-release 的 lodash 模板求值 ⇒ tag 名 = 版本号
        #（求值规则、为什么不能用自定义变量、字面量的 $ 为什么不用转义，见文件顶部说明）
        tagFormat: '${''$PKG_VERSION''}'
        branch: $CNB_BRANCH
        repoUrlHttps: $CNB_REPO_URL_HTTPS
        # 提交里没有可发布变更时不报错（本仓库靠 package.json 显式升版，不依赖提交语义）
        blockWhenFail: false
      exports:
        tag: NEW_TAG
    - name: 校验 tag 与 package.json 版本一致
      # NEW_TAG 必须与 package.json 的 version 逐字相同；配置一旦没盖住内置那条（仍按提交语义推导）
      # 或插件求值行为有变，在此显式失败，不允许默默打错 tag。
      script: |
        EXPECTED=$(grep -A1 -m1 -E '^[[:space:]]*"version"[[:space:]]*:' package.json \
          | grep -oE '[0-9][0-9A-Za-z.+-]*' | head -1)
        test "$NEW_TAG" = "$EXPECTED" || {
          echo "内置插件产出的 tag（'$NEW_TAG'）与根 package.json 的 version（'$EXPECTED'）不一致"
          echo "说明配置没盖住平台内置的 auto_tag（仍按提交语义推导）或插件行为有变，见 .cnb.yml 顶部说明"
          exit 1
        }
        echo "插件产出的 tag = $NEW_TAG"
    - name: 确认 tag 已推送
      # 用未鉴权的 ls-remote 复核（公开仓库可读）：能查到即说明插件已推送、tag_push 会被触发。
      # 刻意不复用本 job 的 CNB_TOKEN——auto_tag 事件下它未必带 repo 读权限。
      script: |
        git ls-remote --tags "$CNB_REPO_URL_HTTPS" "refs/tags/$NEW_TAG" | grep -q "$NEW_TAG" \
          || { echo "远程不存在 tag $NEW_TAG，请检查上方插件输出"; exit 1; }
        echo "tag $NEW_TAG 已推送到远程，将触发 tag_push 发版"


# .env 注入：内容来自密钥仓库（.env 被 .gitignore，故不在代码仓内落盘）
# 密钥仓库中存放 env.dev.yml，内含 OPENVOD_ENV_B64 = base64 -w 0 < .env
.environ: &environ
  name: 从密钥仓库注入 .env
  script: |
    set -e
    sh scripts/gen-env.sh --force
    # 让开发容器新开的终端也自动带上这些变量
    touch ~/.bashrc
    grep -q 'openvod-env' ~/.bashrc || \
      printf '\n# openvod-env\n[ -f %s/.env ] && set -a && . %s/.env && set +a\n' "$PWD" "$PWD" >> ~/.bashrc

$:
  vscode:
    - services:
        - docker
        - vscode
      <<: *devenv
      imports:
        - https://cnb.cool/arsrna/media/openvod-secrets/-/blob/main/env.dev.v2.yml
      stages:
        - <<: *environ
        - <<: *install
  # 每个 web_trigger_* 键对应 .cnb/web_trigger.yml 里 event 同名的按钮
  web_trigger_dev_image:
    - <<: *build-dev-image
  web_trigger_delivery_docker:
    - <<: *build-delivery-image
  web_trigger_delivery_edgeone:
    - <<: *deploy-delivery-edgeone
  web_trigger_admin_docker:
    - <<: *build-admin-image
  web_trigger_worker_docker:
    - <<: *build-worker-image
  web_trigger_player_docker:
    - <<: *build-player-image
  # 手动发布播放器 SDK（补发 / 首次发版前演练：`--registry npm` 可先只发 npm 官方）
  web_trigger_publish_sdk:
    - <<: *publish-sdk
  # tag_push（打 tag 发版）：一次性构建全部运行镜像并推送制品库。
  # 四个 stage 顺序执行（worker → admin → delivery → player），任一失败即中断，不留"半个版本"；
  # 每个镜像同时打 :latest 与 :${CNB_BRANCH}（tag 名）双标签。
  # 注：与上方四个 web_trigger 锚点独立成流水线并行不同，发版要求四镜像同批产出，故单流水线串行。
  tag_push:
    - name: 发布全部运行镜像（worker / admin / delivery）
      runner:
        cpus: 32
      services:
        - docker
      stages:
        - name: docker build worker
          script:
            - docker build -f apps/worker/Dockerfile -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/worker:latest -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/worker:${CNB_BRANCH} . --push
        - name: docker build admin
          script:
            - docker build -f apps/admin/Dockerfile -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/admin:latest -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/admin:${CNB_BRANCH} . --push
        # 构建上下文必须是 apps/delivery（Dockerfile 的 COPY 路径相对该目录）。
        # SCF 仅接受 x86：构建机若为 arm64，改用 buildx：
        #   docker buildx build --platform linux/amd64 --push -t .../delivery:latest -t .../delivery:${CNB_BRANCH} apps/delivery
        - name: docker build delivery
          script:
            - cd apps/delivery
            - docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/delivery:latest -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/delivery:${CNB_BRANCH} . --push
        - name: docker build player
          script:
            - docker build -f apps/player/Dockerfile -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/player:latest -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/player:${CNB_BRANCH} . --push

    # 播放器 SDK 发版（与镜像同批的**独立 job**）：单测覆盖率上报 + 发布 openvod-jssdk 到
    # npm 官方与 CNB 制品库，版本取根 package.json 的 version（并校验与 tag 名一致）。
    # 独立 job 便于 SDK 发布失败时单独重试（或用「发布播放器SDK」按钮补发），不影响镜像推送。
    - <<: *publish-sdk

  # 自动生成 Tag（任务定义见文件顶部 `.auto-tag` 锚点）：
  # Tag 列表页点按钮 → 读根 package.json 的 version → 打同名 tag → 触发 tag_push
  # （四镜像 + 播放器 SDK 发布；SDK 侧还会校验 tag 名与该 version 一致，不一致拒绝发布）。
  auto_tag:
    - <<: *auto-tag
  # ⚠️ 临时验证入口（验证通过后删除）：手动跑一遍 auto_tag 的等价 job，
  # 确认 git-auto-tag 的 tagFormat 字面量能产出 package.json 的版本号。
  web_trigger_verify_autotag:
    - <<: *auto-tag
