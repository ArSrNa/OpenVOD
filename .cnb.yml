# 仓库镜像（CNB → GitHub）的同步定义连同 `main:` / `demo:` 的 push 条目都在 .cnb/sync-github.yml，
# 这里只 include：include 是文本级合并，锚点不能跨文件，所以引用必须留在被 include 的文件内。
include:
  - ./.cnb/sync-github.yml

.devenv: &devenv
  docker:
    # build: .ide/Dockerfile
    image: docker.cnb.cool/arsrna/media/openvod/dev:latest
  runner:
    cpus: 32

.install: &install
  name: 安装固定版本 Bun 和仓库依赖
  script:
    - bun i

.build-dev-image: &build-dev-image
  name: 构建并推送开发环境镜像
  runner:
    cpus: 32
  services:
    - docker
  stages:
    - name: buildx 构建并推送 dev 镜像
      script:
        - docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/dev:latest -f .ide/Dockerfile . --push

# 分发端镜像（ADR-0003：SCF 容器目标）
# 构建上下文必须是 apps/delivery —— Dockerfile 的 COPY 路径相对该目录，用仓库根会找不到 go.mod。
# 注意：SCF 仅接受 x86。构建机若为 arm64（或需强制对齐架构），把最后两条改成：
#   docker buildx build --platform linux/amd64 --push -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/delivery:latest apps/delivery
.build-delivery-image: &build-delivery-image
  name: 构建并推送 delivery 镜像
  runner:
    cpus: 32
  services:
    - docker
  stages:
    - name: docker build delivery
      script:
        - cd apps/delivery
        # 版本信息注入 GET /v1/meta（唯一真源 = 根 package.json）。
        # 这里跑在只有 docker 的 runner 上，没有 bun/node，故用 sed 解析，不能用 bun -e。
        - VERSION=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' ../../package.json | head -n 1)
        - test -n "$VERSION" || { echo "无法从根 package.json 读取 version"; exit 1; }
        - COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
        - BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        - docker build --build-arg VERSION="$VERSION" --build-arg COMMIT="$COMMIT" --build-arg BUILD_TIME="$BUILD_TIME" -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/delivery:latest . --push

# 分发端 EdgeOne Cloud Functions（ADR-0003：与 SCF 容器同级的另一个目标）
# 用开发镜像的 Go + Bun；scripts/edgeone.ts 固定 Makers CLI 版本，构建和上传使用同一份产物。
# 变量值先留空：正式值走 CNB 密钥仓库 imports（或平台环境变量），不要写进仓库。
.deploy-delivery-edgeone: &deploy-delivery-edgeone
  name: 构建并部署 delivery 到 EdgeOne
  runner:
    cpus: 32
  docker:
    image: docker.cnb.cool/arsrna/media/openvod/dev:latest
  env:
    EO_DELIVERY_URL: https://delivery.ovod.skirk.cn
    EO_API_REGION: china
  stages:
    - name: 构建 Makers 产物并校验 Go 根路径路由
      script: bun --no-env-file scripts/edgeone.ts build
    - name: 校验生产引导变量并上传 Makers 产物
      imports: https://cnb.cool/arsrna/env/-/blob/main/tencent.yml
      script: bun --no-env-file scripts/edgeone.ts deploy
    - name: 等待分发服务就绪并验证播放鉴权路由
      script: bun --no-env-file scripts/check-delivery-deployment.ts "$EO_DELIVERY_URL"

# 管理端 admin 镜像（ADR-0003 / ADR-0013：Next.js 全栈单容器，UI + API 同源）
# 构建上下文是**仓库根**：admin 经 transpilePackages 直接消费 workspace 的 TS 源码包。
# 镜像 runtime 阶段含 ffmpeg/ffprobe（管理端「生成元数据」与「水印图片宽高」就地探测，spec.md §2.1 / §10.2）。
.build-admin-image: &build-admin-image
  name: 构建并推送 admin 镜像
  runner:
    cpus: 32
  services:
    - docker
  stages:
    - name: docker build admin
      script:
        - docker build -f apps/admin/Dockerfile -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/admin:latest . --push

# 转码 Worker 镜像（ADR-0003 / ADR-0008：Bun 常驻容器；P0 转码禁止上函数）
# 构建上下文同为仓库根；镜像内含 ffmpeg/ffprobe（worker 启动自检的必需项）。
# 这里推的 worker:latest 同时是「转推worker到腾讯云CCR」的数据源：构建参数（尤其 --platform）改动要两边一起看。
.build-worker-image: &build-worker-image
  name: 构建并推送 worker 镜像
  runner:
    cpus: 32
  services:
    - docker
  stages:
    - name: docker build worker
      script:
        - docker build -f apps/worker/Dockerfile -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/worker:latest . --push

# 转码 worker → 腾讯云 CCR（仓库 tcb-${CCR_UIN}-iydy/openvod，标签 :worker）
# 用途：云托管 / TCB 侧取 worker 镜像；凭据同样来自密钥仓库 ccr.yaml，只在本 stage 注入。
#
# **不从 Dockerfile 重建**：直接取 CNB 制品库里「构建worker（Docker）」产出的镜像，换标签 + 转 docker 媒体类型。
# 省掉 apt（ffmpeg / fonts-noto-cjk）、bun install、Prisma 生成这条整链（单次 10 分钟级）。
# 使用顺序：先跑「构建worker（Docker）」把新镜像推上制品库，再跑本任务转推 CCR。源永远是 :latest。
# 源镜像必须带 linux/amd64（制品库现有 worker 实测为 amd64）；日后构建机换架构时，
# 要先让「构建worker（Docker）」用 --platform linux/amd64 产出，否则这里会报 no match for platform。
#
# 为什么不能 `docker pull` + `docker tag` + `docker push` 了事：
#   制品库里的 worker 是 OCI image index（还带一个 attestation manifest）；本环境 Docker 29 用
#   containerd 镜像存储（overlayfs / io.containerd.snapshotter.v1），docker push 原样推回 OCI，
#   CCR 里显示成 OCI-Image-v1。
# 为什么不能 `docker buildx imagetools create`：
#   它只搬 manifest、不改 mediaType，OCI 进去 OCI 出来。
# 为什么 FROM-only + buildx build 不算重建：
#   临时 Dockerfile 只有一行 FROM，没有 RUN / COPY / ADD，构建器不执行任何构建指令，
#   等价于「导出器把基础镜像的层按 docker v2 schema2 重新打包」：层 digest 与源镜像一致
#   （不会重新压缩、不会重跑 apt），CCR 里已存在的层由导出器跳过，不再传输。
# 反例实测（勿改回）：
#   - `--output type=docker` + docker push → 仍推 OCI index；
#   - 漏掉 --provenance=false / --sbom=false → 被包成 OCI image index；
#   - `--output type=image` 但漏掉 oci-mediatypes=false → manifest 仍是 OCI。
.push-worker-ccr: &push-worker-ccr
  name: 复用制品库镜像转推 worker 到腾讯云 CCR（不重建）
  runner:
    cpus: 8 # 纯搬运：只拉 manifest / 转格式 / 推层，不吃 CPU
  services:
    - docker
  stages:
    - name: 登录 CCR → 换标签并转成 docker 媒体类型 → 推送
      imports:
        - https://cnb.cool/arsrna/env/-/blob/main/ccr.yaml # CCR_UIN / CCR_PASSWORD
      script: |
        set -euo pipefail
        : "${CCR_UIN:?密钥仓库 ccr.yaml 未提供 CCR_UIN}"
        : "${CCR_PASSWORD:?密钥仓库 ccr.yaml 未提供 CCR_PASSWORD}"
        SRC="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/worker:latest"
        IMAGE="ccr.ccs.tencentyun.com/tcb-${CCR_UIN}-iydy/openvod:worker"
        echo "源镜像：$SRC"
        echo "目标镜像：$IMAGE"

        # 1) 登录：口令走 --password-stdin（用 -p 会把口令整条回显在流水线日志里）
        if [ -n "${CNB_TOKEN:-}" ]; then
          printf '%s' "$CNB_TOKEN" | docker login "$CNB_DOCKER_REGISTRY" --username "${CNB_TOKEN_USER_NAME:-cnb}" --password-stdin
        fi
        printf '%s' "$CCR_PASSWORD" | docker login ccr.ccs.tencentyun.com --username "$CCR_UIN" --password-stdin

        # 2) 源镜像必须已存在（制品库是唯一来源，本任务不再兜底构建）
        docker buildx imagetools inspect "$SRC" || {
          echo "制品库没有 $SRC：先在分支页点「构建worker（Docker）」，再点本任务"; exit 1; }

        # 3) 换标签 + 转 docker v2 schema2，**导出侧**锁类型：
        #      oci-mediatypes=false → manifest 为 application/vnd.docker.distribution.manifest.v2+json
        #      --provenance=false / --sbom=false → 不附带证明与附件（否则会被包成 OCI index）
        #    空构建上下文：临时 Dockerfile 没有 COPY，构建器不会读仓库；换目录执行以免误把仓库当上下文。
        WORK=$(mktemp -d)
        printf 'FROM %s\n' "$SRC" > "$WORK/retag.Dockerfile"
        docker buildx build \
          -f "$WORK/retag.Dockerfile" \
          --platform linux/amd64 \
          --provenance=false \
          --sbom=false \
          --output type=image,name="$IMAGE",oci-mediatypes=false,push=true \
          "$WORK"
        rm -rf "$WORK"

        # 4) 断言远端确实是 Docker v2 schema2，避免「推成功但类型退回 OCI」到部署阶段才发现
        MEDIA=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.MediaType}}')
        echo "远端 manifest 媒体类型：$MEDIA"
        test "$MEDIA" = "application/vnd.docker.distribution.manifest.v2+json" \
          || { echo "推送结果不是 Docker v2 schema2（得到 $MEDIA），检查 --provenance=false / oci-mediatypes=false"; exit 1; }
        echo "已推送到腾讯云 CCR：$IMAGE"

# 播放演示 App player 镜像（spec.md §11.8：Next.js 全栈单容器，免登录播放端 Demo）
# 构建上下文同为仓库根（workspace 源码直引）；不依赖 Prisma，构建期无需生成客户端与 env——
# 浏览器直连分发端地址由运行时 env 下发（/api/session 的 delivery_base），镜像可跨环境复用。
.build-player-image: &build-player-image
  name: 构建并推送 player 镜像
  runner:
    cpus: 32
  services:
    - docker
  stages:
    - name: docker build player
      script:
        - docker build -f apps/player/Dockerfile -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/player:latest . --push

# 播放器 SDK（openvod-jssdk）：单测覆盖率上报 + 发布到 npm 官方与 CNB 制品库。
# 版本号唯一真源 = 根 package.json 的 version（与 auto_tag 同口径，tag_push 时脚本还会校验 tag 名与版本一致）；
# 发布清单 / dist 构建 / 产物自包含校验都由 packages/player-sdk/scripts/publish.ts 负责（本地同一条命令可复现）。
# 触发：tag_push（打 tag 发版，与镜像同批，仅当 packages/player-sdk 有改动）+ 手动按钮 web_trigger_publish_sdk（补发 / 先只发 npm，手动触发一律发）。
.publish-sdk: &publish-sdk
  name: 发布播放器 SDK（单测覆盖率 + npm 官方 / CNB 制品库）
  runner:
    cpus: 8
  docker:
    image: docker.cnb.cool/arsrna/media/openvod/dev:latest # 内置 Bun 1.4 / Node 22 / npm
  env:
    # CNB npm 制品库地址（控制台「制品库 → 设置 → 基础设置」复制；须放在 env 下才会注入为环境变量）。
    # 也可改由密钥仓库 env/npm.yml 提供同名变量——同一 job 内 env 优先于 imports。
    CNB_NPM_REGISTRY: https://npm.cnb.cool/arsrna/media/openvod-jssdk/-/packages/
  stages:
    - name: 判断这次要不要发
      # 手动按钮 / API 触发一律发布（补发场景）；tag_push 只在 packages/player-sdk 有改动时发，
      # 跳过时后面几个 stage 全部不跑。变更检测与镜像构建共用同一个脚本，口径一致。
      script: |
        if [ "${CNB_EVENT:-}" = "tag_push" ]; then
          sh scripts/ci/changed-scope.sh
        else
          echo "非 tag_push 事件，直接发布"
          echo "##[set-output scope_sdk=1]"
        fi
      exports:
        scope_sdk: PUBLISH_SDK
    - <<: *install
      if: '[ "${PUBLISH_SDK:-1}" = "1" ]'
    - name: 单测与覆盖率
      if: '[ "${PUBLISH_SDK:-1}" = "1" ]'
      script: bun run --cwd packages/player-sdk test:coverage
    - name: 覆盖率上报（CNB 洞察 / 徽章）
      if: '[ "${PUBLISH_SDK:-1}" = "1" ]'
      type: testing:coverage
      options:
        pattern: packages/player-sdk/coverage/lcov.info
        allowExts: ".ts"
        lines: 70 # 全量行覆盖率红线（当前 ~98%，低于此值阻断发布）
        breakIfNoCoverage: true
      exports:
        lines: SDK_COVERAGE
    - name: 构建并发布（npm 官方 + CNB 制品库）
      if: '[ "${PUBLISH_SDK:-1}" = "1" ]'
      imports:
        - https://cnb.cool/arsrna/env/-/blob/main/npm.yml # NPM_TOKEN；CNB 制品库用内置 CNB_TOKEN
      script:
        - bun packages/player-sdk/scripts/publish.ts --registry both

# 自动生成 Tag（Tag 列表页「自动生成 Tag」按钮触发）：tag 名 = **根 package.json 的 version**（不带 v 前缀）。
#
# ── 挂载位置：必须写在**分支名下**（这里的 `main:`），不能写 `$` 兜底 ──
# `auto_tag` 是平台的「页面操作事件」：点按钮时平台先注入一条内置流水线
# （镜像 cnbcool/git-auto-tag，按 feat/fix 提交语义推导版本），再与 .cnb.yml 合并。
# 官方 build/trigger-rule.md「配置覆盖规则」原文：
#   「如果 .cnb.yml 中 auto_tag 配置在 `$` 下而不是默认分支名下，
#     两边的 auto_tag 配置都会保留，但 `$` 下的配置会被忽略。」
# 本仓库两次在这条上翻车，都是把「生效的是内置插件」误读成「我们的 job 生效了」：
#   - cnb-s7p-1k51v01kf（sha 6e982a2，当时挂 `main:`）→ 日志里跑的是本任务的三个 stage
#     （docker pull node:22），内置插件的 docker run 没有出现 ⇒ 同分支覆盖成立；
#   - cnb-tp7-1k52fq5kb（sha f8f600a，挂 `$`）与 cnb-nuh-1k52f23cb（sha 09de7a5）→ 日志里
#     只有 `docker run cnbcool/git-auto-tag` 与末尾那句内置 job 特有的 `echo $NEW_TAG`，
#     本任务的 stage 一个都没出现 ⇒ `$` 下确实被忽略，semantic-release 把 version=1.1.0
#     按提交语义推导成了 0.3.0。
# 以后辨析「跑的是谁」看末尾有没有 `echo $NEW_TAG`：有 = 内置 job，没有 = 本任务。
#
# 因为这里盖掉了内置那条，整条链路（读版本 → 打 tag → 推 tag）都由本任务自己完成，
# 不依赖插件的提交语义推导，也不依赖 `settings.tagFormat` 的模板求值技巧。
#
# 运行 / 检出分支由 CNB「Tag 自动生成配置」决定：默认分支下的 .cnb/settings.yml →
# tag.auto_tag.branch（默认值 = 仓库默认分支 main；本仓库未配置该文件）；Tag 列表页按钮
# **不能临时选分支**，检出内容 = 该分支最新 commit ⇒ **发版前先把待发布提交合入 main**。
# 若把发版源分支改到别的分支，下面 `main:` 段的键名要同步改。
.auto-tag: &auto-tag
  name: 按根 package.json 版本创建 Tag
  docker:
    # 用仓库开发镜像（内置 git-lfs）：本仓库用 LFS 追踪 videos/mv.mp4（.gitattributes），
    # CNB 检出会带 git-lfs 的 pre-push 钩子；缺 git-lfs 的镜像（如 node:22）在钩子处直接 push 失败
    # —— 2026-10-16 实测：`This repository is configured for Git LFS but 'git-lfs' was not found`。
    image: docker.cnb.cool/arsrna/media/openvod/dev:latest # 含 node / git / git-lfs / bun
  stages:
    - name: 读取并校验根 package.json 的版本号
      script: |
        VERSION=$(bun -e 'process.stdout.write(require("./package.json").version)')
        echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
          || { echo "根 package.json 的 version 不是合法语义化版本：'$VERSION'"; exit 1; }
        echo "根 package.json 的 version = $VERSION"
        echo "##[set-output version=$VERSION]"
      exports:
        version: PKG_VERSION
    - name: 校验远程尚无同名 Tag
      # 已存在就失败（提示先升版本），避免用同一个版本号反复点按钮把发版链路打乱。
      script: |
        if git ls-remote --tags "$CNB_REPO_URL_HTTPS" "refs/tags/$PKG_VERSION" | grep -q "refs/tags/$PKG_VERSION"; then
          echo "远程已存在 tag $PKG_VERSION：请先升级根 package.json 的 version 再发版"; exit 1
        fi
        echo "远程尚无 tag $PKG_VERSION"
    - name: 创建并推送 Tag
      # 用 origin 推送：检出时 runner 已写好凭据（credential.helper → .git/.git-credentials），
      # 与内置 git-auto-tag 插件推 0.3.0 走的是同一条路，不必再手工拼带令牌的 URL。
      # --no-verify：跳过检出带的 pre-push 钩子（内容是 `git lfs pre-push`）。推 tag 只上传 tag
      # 对象、不涉及任何 LFS 对象，跳过是安全的；留着反而会因镜像缺 git-lfs 而直接失败。
      script: |
        git tag -a "$PKG_VERSION" -m "Release $PKG_VERSION"
        git push --no-verify origin "refs/tags/$PKG_VERSION"
    - name: 确认 Tag 已推送
      # 不复用上面的令牌地址：这里要的正是「远端确实查得到」，而 tag 推送本身已在上一步鉴权完成。
      script: |
        git ls-remote --tags "$CNB_REPO_URL_HTTPS" "refs/tags/$PKG_VERSION" | grep -q "refs/tags/$PKG_VERSION" \
          || { echo "远程不存在 tag $PKG_VERSION，请检查上方推送输出"; exit 1; }
        echo "tag $PKG_VERSION 已推送到远程，将触发 tag_push 发版"

# .env 注入：内容来自密钥仓库（.env 被 .gitignore，故不在代码仓内落盘）
# 密钥仓库中存放 env.dev.yml，内含 OPENVOD_ENV_B64 = base64 -w 0 < .env
.environ: &environ
  name: 从密钥仓库注入 .env
  script: |
    set -e
    sh scripts/gen-env.sh --force
    # 让开发容器新开的终端也自动带上这些变量
    touch ~/.bashrc
    grep -q 'openvod-env' ~/.bashrc || \
      printf '\n# openvod-env\n[ -f %s/.env ] && set -a && . %s/.env && set +a\n' "$PWD" "$PWD" >> ~/.bashrc

$:
  vscode:
    - services:
        - docker
        - vscode
      <<: *devenv
      imports:
        - https://cnb.cool/arsrna/media/openvod-secrets/-/blob/main/env.dev.v2.yml
      stages:
        - <<: *environ
        - <<: *install
  # 每个 web_trigger_* 键对应 .cnb/web_trigger.yml 里 event 同名的按钮
  web_trigger_dev_image:
    - <<: *build-dev-image
  web_trigger_delivery_docker:
    - <<: *build-delivery-image
  web_trigger_delivery_edgeone:
    - <<: *deploy-delivery-edgeone
  web_trigger_admin_docker:
    - <<: *build-admin-image
  web_trigger_worker_docker:
    - <<: *build-worker-image
  web_trigger_worker_ccr:
    - <<: *push-worker-ccr
  web_trigger_player_docker:
    - <<: *build-player-image
  # 手动发布播放器 SDK（补发 / 首次发版前演练：`--registry npm` 可先只发 npm 官方）
  web_trigger_publish_sdk:
    - <<: *publish-sdk
  # tag_push（打 tag 发版）：**只构建这次真的改了的镜像**，不再四个全建。
  #
  # 为什么不用 ifModify：CNB 只在 push / commit.add / PR 事件统计变更文件，tag_push 会直接忽略
  # ifModify（语法手册：「上述支持事件以外，不适合统计文件变更，会忽略 ifModify 检查」）。
  # 所以用等价做法：stage 1 跑 scripts/ci/changed-scope.sh，对比「上一个 tag → 本次 tag」，
  # 结论经 stage exports 注入环境变量，stage 2 的每个并行 job 用 if 决定跑不跑。
  # 「哪类改动触发哪个镜像」全在那个脚本的 *_PATHS 正则里，改依赖范围只改它。
  #
  # 四个镜像仍在**同一个 Stage 的四个并行 job** 里（jobs 对象形式 = 并行）：跳过的 job 不占构建时间，
  # 最坏情况仍是一个节拍做完，最好情况（只改一个应用）只付一个镜像的构建时间。
  #
  # 标签：重建的镜像同时打 :latest 与 :${CNB_BRANCH}（tag 名）；没重建的镜像由 stage 3 把上一版的
  # tag 复制成本次版本 tag（只搬 manifest，秒级），「按 tag 回滚」的语义不受影响。
  #
  # 例外：根 package.json 的 version 在构建期烘焙进 admin（页脚展示）与 delivery（/v1/meta），
  # 所以「只改版本号」的一版仍会重建这两个镜像。想连这也省掉：把 changed-scope.sh 里的
  # package.json 从 ADMIN_PATHS / DELIVERY_PATHS 删掉，代价是版本号停在各自上次构建时的值。
  tag_push:
    - name: 发版（只构建有改动的镜像）
      runner:
        cpus: 64 # 四镜像并行时的总配额上限（内存 = 核数 × 2G）；只建一两个时用不到，不是预留
      services:
        - docker
      stages:
        - name: 计算本次变更范围
          # 要 git 才做得了 diff；默认构建镜像不保证带 git，用仓库开发镜像
          image: docker.cnb.cool/arsrna/media/openvod/dev:latest
          script: sh scripts/ci/changed-scope.sh
          exports:
            scope_worker: BUILD_WORKER
            scope_admin: BUILD_ADMIN
            scope_delivery: BUILD_DELIVERY
            scope_player: BUILD_PLAYER
            retag_targets: RETAG_TARGETS
            prev_tag: PREV_TAG
        - name: 并行构建有改动的镜像
          # 对象形式 = 并行；job 的 key 即 CNB_BUILD_JOB_NAME / 日志里的任务名
          jobs:
            worker:
              name: docker build worker
              # 条件里的默认值 1 是兜底：变量没导出成功时照旧全建，绝不静默跳过发版
              if: '[ "${BUILD_WORKER:-1}" = "1" ]'
              script:
                - docker build -f apps/worker/Dockerfile -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/worker:latest -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/worker:${CNB_BRANCH} . --push
            admin:
              name: docker build admin
              if: '[ "${BUILD_ADMIN:-1}" = "1" ]'
              script:
                - docker build -f apps/admin/Dockerfile -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/admin:latest -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/admin:${CNB_BRANCH} . --push
            # 构建上下文必须是 apps/delivery（Dockerfile 的 COPY 路径相对该目录）。
            # SCF 仅接受 x86：构建机若为 arm64，改用 buildx：
            #   docker buildx build --platform linux/amd64 --push -t .../delivery:latest -t .../delivery:${CNB_BRANCH} apps/delivery
            delivery:
              name: docker build delivery
              if: '[ "${BUILD_DELIVERY:-1}" = "1" ]'
              script:
                - cd apps/delivery
                # 版本信息注入 GET /v1/meta（唯一真源 = 根 package.json）。
                # 这里跑在只有 docker 的 runner 上，没有 bun/node，故用 sed 解析，不能用 bun -e。
                - VERSION=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' ../../package.json | head -n 1)
                - test -n "$VERSION" || { echo "无法从根 package.json 读取 version"; exit 1; }
                - COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
                - BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                - docker build --build-arg VERSION="$VERSION" --build-arg COMMIT="$COMMIT" --build-arg BUILD_TIME="$BUILD_TIME" -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/delivery:latest -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/delivery:${CNB_BRANCH} . --push
            player:
              name: docker build player
              if: '[ "${BUILD_PLAYER:-1}" = "1" ]'
              script:
                - docker build -f apps/player/Dockerfile -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/player:latest -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/player:${CNB_BRANCH} . --push
        - name: 未重建镜像：把上一版的 tag 复制成本次版本 tag
          # 不重建，只在本仓库制品库内搬 manifest：给「没改动却要有本版本 tag」的镜像补齐，
          # 保证任意一版发出去之后四个镜像都能按 tag 取到。补不上只告警，不阻断发版。
          if: '[ -n "${RETAG_TARGETS:-}" ]'
          script: |
            set -eu
            REG=${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
            # 口令走 --password-stdin，避免 -p 把令牌回显进日志（同 push-worker-ccr）
            if [ -n "${CNB_TOKEN:-}" ]; then
              printf '%s' "$CNB_TOKEN" | docker login "$CNB_DOCKER_REGISTRY" --username "${CNB_TOKEN_USER_NAME:-cnb}" --password-stdin
            fi
            for img in $(printf '%s' "$RETAG_TARGETS" | tr ',' ' '); do
              SRC="$REG/$img:${PREV_TAG}"
              if ! docker buildx imagetools inspect "$SRC" >/dev/null 2>&1; then
                # 上一版没有该 tag 时退回 latest：本次没重建它，内容一致
                SRC="$REG/$img:latest"
              fi
              echo "$img：$SRC → $REG/$img:${CNB_BRANCH}"
              docker buildx imagetools create -t "$REG/$img:${CNB_BRANCH}" "$SRC" \
                || echo "警告：$REG/$img:${CNB_BRANCH} 未补齐，需要该版本镜像时手动点对应构建按钮"
            done

    # 播放器 SDK 发版（与镜像同批的**独立流水线**）：单测覆盖率上报 + 发布 openvod-jssdk 到
    # npm 官方与 CNB 制品库，版本取根 package.json 的 version（并校验与 tag 名一致）。
    # 独立流水线便于 SDK 发布失败时单独重试（或用「发布播放器SDK」按钮补发），不影响镜像推送。
    # tag_push 下它自己判断 packages/player-sdk 有没有改动，没改动则整条跳过。
    - <<: *publish-sdk

# 默认分支名下的配置（CNB 按**分支名**匹配 auto_tag 的流水线配置，`$` 兜底会被忽略）。
# auto_tag 生效链路：Tag 列表页「自动生成 Tag」→ 本任务读根 package.json 的 version → 打同名 tag →
# 触发 tag_push（按变更只构建改到的镜像 + 播放器 SDK 发布；SDK 侧还会校验 tag 名与该 version 一致，不一致拒绝发布）。
main:
  # 默认触发（每次 push 到 main）跑播放器 SDK 单测并上报覆盖率——README 顶部「单测覆盖率」徽章的取数来源。
  # tag_push 只在发版时跑，缺了这条徽章会一直是 unknown。
  # 不加 key：与 *publish-sdk 保持同一个默认覆盖率数据（指定 key 会改写 meta，徽章读不到）。
  # 只在 main 生效，不卡 PR；覆盖率红线不设，避免 SDK 覆盖率波动阻断无关提交。
  push:
    - name: 单测与覆盖率上报
      docker:
        image: docker.cnb.cool/arsrna/media/openvod/dev:latest
      stages:
        - <<: *install
        - name: 单测与覆盖率
          script: bun run --cwd packages/player-sdk test:coverage
        - name: 覆盖率上报（CNB 洞察 / 徽章）
          type: testing:coverage
          options:
            pattern: packages/player-sdk/coverage/lcov.info
            allowExts: ".ts"
            breakIfNoCoverage: true
    # 每次 push 到 main 顺带强制同步到 GitHub 同名分支：那条 pipeline 在 .cnb/sync-github.yml 里，
    # 由 include 合并到本文件的 `main.push`（和上一条是两条独立 pipeline）。

  auto_tag:
    - <<: *auto-tag

# demo 分支的 push 同步也在 .cnb/sync-github.yml（见上）。
