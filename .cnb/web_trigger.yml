# 分支详情页手动触发按钮（event 对应 .cnb.yml 中 $ 下的 web_trigger_* 事件键）
branch:
  - buttons:
      - name: 构建开发环境镜像
        description: 构建 .ide/Dockerfile 并推送 docker.cnb.cool/arsrna/media/openvod/dev:latest
        event: web_trigger_dev_image
      - name: 构建delivery（Docker）
        description: 构建 apps/delivery 镜像并推送到 CNB 制品库（ADR-0003 SCF 容器目标）
        event: web_trigger_delivery_docker
      - name: 构建delivery（Edgeone）
        description: Makers 产物路由校验、生产部署与域名冒烟（项目 openvod-delivery；Token 取自 EO_SECRET）
        event: web_trigger_delivery_edgeone
      - name: 构建admin（Docker）
        description: 构建 apps/admin 镜像并推送到 CNB 制品库（ADR-0013 管理端容器）
        event: web_trigger_admin_docker
      - name: 构建admin（腾讯云CCR）
        description: 构建 apps/admin 镜像并以 docker 媒体类型推送到 ccr.ccs.tencentyun.com/tcb-<CCR_UIN>-iydy/openvod:admin（凭据取密钥仓库 ccr.yaml）
        event: web_trigger_admin_ccr
      - name: 构建worker（Docker）
        description: 构建 apps/worker 镜像并推送到 CNB 制品库（含 ffmpeg/ffprobe）
        event: web_trigger_worker_docker
      - name: 构建worker（腾讯云CCR）
        description: 构建 apps/worker 镜像并以 docker 媒体类型推送到 ccr.ccs.tencentyun.com/tcb-<CCR_UIN>-iydy/openvod:worker（凭据取密钥仓库 ccr.yaml）
        event: web_trigger_worker_ccr
      - name: 构建player（Docker）
        description: 构建 apps/player 镜像并推送到 CNB 制品库（播放演示 App，免登录）
        event: web_trigger_player_docker
      - name: 发布播放器SDK
        description: 单测覆盖率上报 CNB + 发布 openvod-jssdk 到 npm 官方与 CNB 制品库（版本取根 package.json）
        event: web_trigger_publish_sdk
