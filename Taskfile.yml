version: '3'

tasks:
  install:
    cmds: [bun i]

  # ---- 契约与向量（ADR-0001 / ADR-0006） ----
  contracts:
    cmds:
      - bun run contracts
    sources:
      - packages/contracts/src/**/*.ts
    generates:
      - packages/contracts/jsonschema/*.json
      - apps/delivery/internal/contracts/*.go

  vectors:
    cmds: [bun run crypto:vectors]

  # ---- 环境 ----
  env:init:
    desc: 交互式向导生成根 .env（问答 DB/端口、自动生成 MASTER_KEYS；与 gen-env.sh 互补，ADR-0015）
    cmds: [bun scripts/init-env.ts]

  # ---- 数据库（ADR-0004） ----
  db:generate:
    desc: 生成两份 Prisma 客户端（src/index.ts 静态导入 mysql+sqlite，缺一会导致 Next 打包失败）
    cmds:
      - bun run --cwd packages/db generate:mysql
      - bun run --cwd packages/db generate:sqlite

  db:push:
    desc: 开发库建表（SQLite）
    cmds: [bun run --cwd packages/db push:sqlite]

  db:migrate:
    desc: 生产迁移（MySQL，ADR-0003 deploy 第 1 步）
    cmds: [bun run --cwd packages/db migrate:deploy]

  db:parity:
    cmds: [bun run --cwd packages/db parity]

  # ---- 开发 ----
  dev:admin:
    desc: 管理端（Next.js 全栈，Node 运行时，ADR-0013）
    dir: apps/admin
    cmds:
      - |
        set -a; [ -f ../../.env ] && . ../../.env; set +a
        bun run dev
  dev:worker:
    desc: 转码 Worker（Bun --watch，需 ffmpeg/ffprobe）
    dir: apps/worker
    cmds:
      - |
        set -a; [ -f ../../.env ] && . ../../.env; set +a
        bun run dev
  dev:delivery:
    desc: 分发端（Go，:9000，需 MASTER_KEYS / URL_SIGN_KEY_HEX）
    dir: apps/delivery
    cmds:
      - |
        set -a; [ -f ../../.env ] && . ../../.env; set +a
        go run .

  build:admin:
    desc: 管理端生产构建（需先 task db:generate）
    dir: apps/admin
    cmds: [bun run build]

  # ---- 构建 / 测试 / 发布（ADR-0003） ----
  build:delivery:
    dir: apps/delivery
    cmds: [go build -trimpath -ldflags="-s -w" -o bin/delivery .]

  edgeone:prepare:
    desc: 准备独立 Go 项目到 .run/edgeone-delivery（cloud-functions 只保留入口，避免库文件变成路由）
    cmds:
      - bun --no-env-file scripts/edgeone.ts prepare

  build:edgeone:
    desc: 构建 Makers 实际产物并校验根路径路由和 Linux amd64 二进制（ADR-0003）
    cmds:
      - bun --no-env-file scripts/edgeone.ts build

  image:delivery:
    desc: SCF 仅接受 x86，必须显式 --platform（ADR-0003）
    cmds:
      - docker buildx build --platform linux/amd64 -t openvod-delivery:latest apps/delivery

  image:admin:
    desc: 管理端镜像（Next.js 全栈单容器，ADR-0013；构建上下文=仓库根）
    cmds:
      - docker build -f apps/admin/Dockerfile -t openvod-admin:latest .

  image:worker:
    desc: 转码 Worker 镜像（Bun 常驻 + ffmpeg/ffprobe，ADR-0008；构建上下文=仓库根）
    cmds:
      - docker build -f apps/worker/Dockerfile -t openvod-worker:latest .

  image:player:
    desc: 播放演示 App 镜像（Next.js 全栈单容器，spec.md §11.8；构建上下文=仓库根）
    cmds:
      - docker build -f apps/player/Dockerfile -t openvod-player:latest .

  test:
    cmds:
      - bun test
      - go -C apps/delivery test ./...

  smoke:
    desc: P0 冒烟断言（无签名 403 / 密钥与清单 no-store，ADR-0003）
    cmds:
      - echo 'TODO specification：scripts/assert-unsigned-403.sh + assert-no-store.sh'

  deploy:
    desc: 全链路发布，分步见 ADR-0003
    cmds:
      - task: db:migrate
      - task: image:delivery
      - echo 'TODO specification：推 TCR → admin/worker 滚动更新 → edgeone makers deploy → smoke'
